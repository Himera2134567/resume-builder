{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Summarizee — проект «резюмируй!»{% endblock %}</title>

  <style>
    :root{
      /* более тёплый фон */
      --bg:#efe7de;
      --surface:#fff9f1;
      --line:#e5d9cc;
      --ink:#1e1f21;
      --muted:#6c7178;
      --mint:#0ea5a5;     /* свежий бирюзовый акцент */
      --amber:#ef8f00;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans',sans-serif}
    .wrap{max-width:1140px;margin:0 auto;padding:20px}
    .topbar{position:sticky;top:0;background:rgba(239,231,222,.8);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:10}
    .topbar__row{display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;flex-direction:column}
    .brand__logo{font-weight:900;letter-spacing:.3px;font-size:22px}
    .brand__tag{font-size:12px;color:var(--muted)}
    .h1{font-size:28px;margin:12px 0 16px}
    .h2{font-size:20px;margin:0 0 12px}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 28px rgba(0,0,0,.06);margin-bottom:16px}
    .grid{display:grid;gap:16px}
    .grid.two{grid-template-columns:1.2fr 1fr}
    .grid.three{grid-template-columns:repeat(3,1fr)}
    @media (max-width:980px){.grid.two,.grid.three{grid-template-columns:1fr}}

    label{display:block;color:var(--muted);font-size:13px;margin:4px 0 6px}
    input[type=text],input[type=date],input[type=url],input[type=email],textarea{
      width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink)
    }
    textarea{min-height:92px;resize:vertical}

    .btn{display:inline-flex;align-items:center;gap:8px;border:none;background:var(--mint);color:white;padding:10px 14px;border-radius:12px;font-weight:700;cursor:pointer}
    .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
    .btn.ghost{background:transparent;border:1px dashed var(--line);color:var(--muted)}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .btn.sm{padding:6px 10px;border-radius:10px;font-weight:600;font-size:13px}

    .muted{color:var(--muted);font-size:13px}
    .mt-6{margin-top:6px}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}

    .tabs{display:flex;gap:8px;flex-wrap:wrap}
    .tab{padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
    .tab.active{background:#fff7ea;border-color:#ffe0a8}
    .tabpane.hidden{display:none}

    .photo{width:220px;height:220px;border:2px dashed var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
    .photo img{width:100%;height:100%;object-fit:cover}

    .list{border:1px solid var(--line);border-radius:12px;max-height:340px;overflow:auto;background:#fff}
    .item{padding:10px 12px;border-bottom:1px solid var(--line);position:relative}
    .item:last-child{border-bottom:none}
    .actions{position:absolute;top:8px;right:10px;display:flex;gap:6px}
    .copy{display:flex;gap:8px}
    .copy input{flex:1}
    .progress{height:8px;background:#fff;border:1px solid var(--line);border-radius:999px;overflow:hidden}
    .progress__bar{height:100%;width:0;background:linear-gradient(90deg,var(--mint),#84f0e0)}
    .footer{border-top:1px solid var(--line);color:var(--muted);padding:22px 0;margin-top:28px;text-align:center}
    a{color:#8f5c00}

    /* чтобы якоря не «подпрыгивали» под фикс-хедер */
    section:target{scroll-margin-top:80px}
  </style>

  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar__row">
      <div class="brand">
        <div class="brand__logo">Summarizee</div>
        <div class="brand__tag">проект «резюмируй!»</div>
      </div>
      <nav><a class="btn secondary" href="/builder/">Конструктор</a></nav>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="wrap">© Summarizee — делаем резюме быстро.</div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
